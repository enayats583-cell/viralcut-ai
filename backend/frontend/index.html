<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ViralCut AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:25px;font-family:Arial,sans-serif;background:#0d1020;color:white}
main{max-width:680px;margin:auto;padding:25px;background:#171b31;border-radius:18px}
h1{color:#a994ff;margin-top:0}
p{color:#b8bfdc}
input,select,button{width:100%;padding:14px;margin:9px 0;border-radius:9px;border:1px solid #41496d;background:#0d1020;color:white;font-size:15px}
button{background:#7357ff;border:0;font-weight:bold;cursor:pointer}
#status{margin-top:15px;word-break:break-word;line-height:1.5}
</style>
</head>
<body>
<main>
<h1>ViralCut AI</h1>
<p>Paste a YouTube link. AI will automatically find the best viral moment and crop it.</p>

<label>YouTube Video Link</label>
<input type="url" id="url" placeholder="https://www.youtube.com/watch?v=...">

<label>Clip Duration (Seconds)</label>
<input type="number" id="duration" value="30" min="5" max="180">

<label>Video Format</label>
<select id="aspect">
<option value="9:16">9:16 (Shorts / Reels)</option>
<option value="16:9">16:9 (YouTube)</option>
<option value="1:1">1:1 (Square)</option>
</select>

<button onclick="makeClip()">Find Viral Moment & Create Clip</button>
<div id="status"></div>
</main>

<script>
async function makeClip(){
 const status=document.getElementById("status");
 const url=document.getElementById("url").value.trim();
 if(!url){status.textContent="Please paste a YouTube link.";return;}

 status.textContent="AI best viral moment dhoondh raha hai aur clip bana raha hai... (30-60s lag sakte hain)";

 try{
  const res=await fetch("/api/auto-clip",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    url:url,
    duration:Number(document.getElementById("duration").value),
    aspect:document.getElementById("aspect").value
   })
  });
  const data=await res.json();
  if(!res.ok) throw new Error(data.detail||"Failed");

  status.innerHTML=
   `<b>AI Pick:</b> ${data.reason} (Start: ${data.start_time}s)<br><br>`+
   `<a style="color:#a994ff;font-weight:bold" href="${data.download_url}">Download Short Clip</a>`;
 }catch(err){
  status.textContent="Error: "+err.message;
 }
}
</script>
</body>
</html>
